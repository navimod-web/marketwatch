name: Initial Portfolio JSON Producer

on:
  schedule:
    # TR saatiyle 08:00 ve 16:00 (UTC 05:00 ve 13:00)
    - cron: '0 5,13 * * *'
  workflow_dispatch: # Manuel test butonu

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Yazma izni şart
      
    steps:
      # 1. Token ile Repoyu İndir (Diğer action'ı tetiklemek için)
      - name: Repoyu Çek
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      # 2. Python Ortamını Kur
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Kütüphaneleri Yükle
      - name: Kütüphaneleri Yükle
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas requests; fi

      # 4. Scripti Çalıştır (Dosyayı sıfırdan yaratır)
      - name: Scripti Çalıştır
        run: python weekly_portfolio_review.py

      # 5. Kaydet ve Gönder
      - name: Değişiklikleri Pushla
        run: |
          # Bu 2 satır ZORUNLU (Yoksa "Kimsin sen?" hatası verir)
          git config user.name "Marketwatch Bot"
          git config user.email "action@github.com"
          
          # Yeni yaratılan dosyayı sahneye al
          git add portfolio_review.json
          
          # Değişiklik varsa kaydet ve gönder, yoksa hata verme
          git commit -m "Guncel veri: portfolio_review.json" || echo "Degisiklik yok"
          git push
