name: Veri Analiz ve JSON Üretici

on:
  schedule:
    # UTC 05:00 (TR 08:00) ve UTC 13:00 (TR 16:00)
    - cron: '0 5,13 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git push için yazma izni
      
    steps:
      # 1. Repoyu İndir (Token ile indiriyoruz ki pushlayınca diğer action tetiklensin)
      - name: Repoyu Çek
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      # 2. Hata Ayıklama: Dosyalar nerede?
      # Eğer "file not found" hatası alırsanız loglarda buraya bakın.
      - name: Dosya Yapısını Listele
        run: ls -R

      # 3. Python Kurulumu
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 4. Kütüphaneleri Yükle
      - name: Kütüphaneleri Yükle
        run: |
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            # Dosya yoksa standart kütüphaneleri yükle
            pip install pandas requests
          fi

      # 5. Scripti Çalıştır
      # weekly_portfolio_review.py; etf_data.json, news_data.json ve portfolio.txt'yi okur.
      - name: Python Scriptini Çalıştır
        run: python weekly_portfolio_review.py

      # 6. Sonucu Kaydet ve Pushla
      - name: Değişiklikleri Gönder
        run: |
          git config user.name "Marketwatch Bot"
          git config user.email "bot@marketwatch.com"
          
          # Scriptin ürettiği çıktı dosyasını ekle
          # (Önceki konuşmamıza istinaden çıktının adı portfolio_review.json varsayılmıştır)
          git add portfolio_review.json
          
          # Değişiklik varsa commit at, yoksa hata vermeden devam et
          git commit -m "Otomatik veri guncellemesi" || echo "Degisiklik yok"
          git push
