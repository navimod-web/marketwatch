name: Weekly Portfolio Review
on:
  schedule:
    - cron: '0 5,13 * * 1-5'  # Hafta içi UTC 05:00 ve 13:00 (TR: 08:00, 16:00)
  workflow_dispatch:

jobs:
  generate-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Kütüphaneleri Yükle
        run: |
          pip install pandas requests openai
          
      - name: Gerekli Dosyaları Kontrol Et
        run: |
          echo "📂 Checking required files..."
          ls -la
          
          if [ ! -f etf_data.json ]; then
            echo "❌ etf_data.json bulunamadı!"
            exit 1
          fi
          
          if [ ! -f portfolio.txt ]; then
            echo "❌ portfolio.txt bulunamadı!"
            exit 1
          fi
          
          echo "✅ Required files found"
          
      - name: Portfolio Review Çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5-mini"  # veya gpt-5-mini
        run: python weekly_portfolio_review.py
        
      - name: Sonuçları Kontrol Et
        run: |
          echo "📊 Generated files:"
          ls -la *.json
          
          if [ ! -f portfolio_review.json ]; then
            echo "❌ portfolio_review.json üretilemedi!"
            exit 1
          fi
          
          echo "✅ portfolio_review.json başarıyla oluşturuldu"
          echo "📄 Preview:"
          head -50 portfolio_review.json
          
       - name: Değişiklikleri Pushla
         run: |
          git config user.name "Marketwatch Bot"
          git config user.email "bot@marketwatch.com"
          
          git add portfolio_review.json
          git commit -m "📊 Portfolio Review $(date +'%Y-%m-%d %H:%M')" || echo "Değişiklik yok"
          git pull --rebase origin main || true
          git push
