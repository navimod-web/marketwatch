name: Sonucu Portfolio Reposuna Gönder
on:
  push:
    paths:
      - 'portfolio_review.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  transfer-file:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Çek
        uses: actions/checkout@v3
        
      - name: Hedef Çek
        uses: actions/checkout@v3
        with:
          repository: 'navimod-web/portfolioreview'
          token: ${{ secrets.ACTION_TOKEN }}
          path: 'hedef-repo'
          ref: 'main'
          
      - name: Dosyayı Kopyala ve Pushla
        run: |
          cp portfolio_review.json hedef-repo/
          cd hedef-repo
          git config user.name "Transfer Botu"
          git config user.email "bot@transfer.com"
          git add portfolio_review.json
          git commit -m "📊 Portfolio Review $(date +'%Y-%m-%d %H:%M')" || echo "Değişiklik yok"
          git push

