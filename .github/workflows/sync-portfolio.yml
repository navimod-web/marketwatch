name: Sonucu Portfolio Reposuna Gönder
on:
  push:
    paths:
      - 'portfolio_review.json'
    branches:
      - main
      
  # Manuel tetikleme opsiyonu
  workflow_dispatch:

jobs:
  transfer-file:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak (Marketwatch) Çek
        uses: actions/checkout@v3
        
      - name: Dosya Varlığını Kontrol Et
        run: |
          if [ ! -f portfolio_review.json ]; then
            echo "❌ portfolio_review.json bulunamadı!"
            exit 1
          fi
          echo "✅ portfolio_review.json mevcut"
          
      - name: Hedef (PortfolioReview) Çek
        uses: actions/checkout@v3
        with:
          repository: 'navimod-web/portfolioreview'
          token: ${{ secrets.ACTION_TOKEN }}
          path: 'hedef-repo'
          ref: 'master'
          
      - name: Dosyayı Kopyala
        run: |
          cp portfolio_review.json hedef-repo/
          echo "✅ Dosya kopyalandı"
          
      - name: Karşıya Yükle
        run: |
          cd hedef-repo
          git config user.name "Transfer Botu"
          git config user.email "bot@transfer.com"
          
          git add portfolio_review.json
          git commit -m "📊 Portfolio Review $(date +'%Y-%m-%d %H:%M')" || echo "Değişiklik yok"
          git push
          echo "✅ Push tamamlandı"
