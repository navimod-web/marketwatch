name: Daily Market Update

on:
  schedule:
    # Türkiye Saati 07:00 = UTC 04:00
    - cron: '0 4 * * *'
    # Türkiye Saati 15:30 = UTC 12:30
    - cron: '30 12 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4
    
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 1. Adım - Verileri Çek (ETF + Stocks)
      run: python etf_data_generator.py
    
    - name: 2. Adım - Haberleri Çek + Sentiment Analizi
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python generate_news.py
    
    - name: 3. Adım - ETF Raporu Hazırla
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python generate_brief.py
    
    - name: 4. Adım - Hisse (Stock) Raporu Hazırla
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python generate_brief_stocks.py
    
    - name: Sonuçları Kaydet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add etf_data.json news_data.json brief.json brief_stocks.json
        git commit -m "Market Update: $(date +'%Y-%m-%d %H:%M') UTC" || echo "Değişiklik yok"
        git push
