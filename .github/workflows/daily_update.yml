name: Daily Market Update

on:
  schedule:
    # UTC 23:00 = Türkiye Saati 02:00
    - cron: '0 23 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Adım - Verileri Çek (ETF + Stocks)
      run: python etf_data_generator.py

    - name: 2. Adım - ETF Raporu Hazırla
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python generate_brief.py

    - name: 3. Adım - Hisse (Stock) Raporu Hazırla
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python generate_brief_stocks.py

    - name: Sonuçları Kaydet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # 3 dosya da ekleniyor: Veri, ETF Raporu, Hisse Raporu
        git add etf_data.json brief.json brief_stocks.json
        git commit -m "Günlük Güncelleme: $(date +'%Y-%m-%d')" || echo "Değişiklik yok"
        git push
