<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Sentiment Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--card:#0d1117;--card2:#161b22;--t1:#e6edf3;--t2:#7d8590;--t3:#484f58;--brd:rgba(255,255,255,0.06);--grn:#3fb950;--red:#f85149;--acc:#8b5cf6;--acc-d:rgba(139,92,246,0.12);--acc-g:rgba(139,92,246,0.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,0.05),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(63,185,80,0.025),transparent);pointer-events:none;z-index:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .35s ease-out both}.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
.container{max-width:1480px;margin:0 auto;padding:20px 24px;position:relative;z-index:1}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--brd)}
.hdr-l{display:flex;align-items:center;gap:14px}
.hdr h1{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700;letter-spacing:-.5px}
.badge{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--acc-d);color:var(--acc);letter-spacing:1px;text-transform:uppercase}
.hdr-r{display:flex;gap:12px;align-items:center}
.hdr-date{font-size:.8rem;color:var(--t2);font-family:'JetBrains Mono',monospace}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--brd);background:var(--card);color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.home-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.home-btn svg{width:14px;height:14px}

/* Toggle */
.vtog{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:4px;border:1px solid var(--brd)}
.vb{padding:8px 20px;border:none;border-radius:8px;background:transparent;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.vb.on{background:var(--acc);color:#fff;box-shadow:0 2px 8px var(--acc-g)}
.vb:hover:not(.on){background:var(--card2)}

/* Overview Hero */
.ov-hero{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:30px 36px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.ov-hero-l{flex:1}
.ov-lbl{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:14px}
.ov-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.ov-big{font-family:'JetBrains Mono',monospace;font-size:4.8rem;font-weight:800;line-height:1}
.ov-band{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.ov-sub{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--t2);margin-top:14px}
.ov-sub .g{color:var(--grn);font-weight:600}.ov-sub .r{color:var(--red);font-weight:600}
.ov-gw{width:300px;flex-shrink:0}
.ov-gb{height:14px;border-radius:7px;position:relative;background:linear-gradient(90deg,#991b1b 0%,#dc2626 12%,#ef4444 22%,#f59e0b 38%,#eab308 48%,#84cc16 58%,#22c55e 72%,#16a34a 85%,#15803d 100%)}
.ov-gn{position:absolute;top:-7px;width:4px;height:28px;background:#fff;border-radius:2px;box-shadow:0 0 12px rgba(255,255,255,.7);transform:translateX(-50%);transition:left .6s}
.ov-gsl{position:absolute;top:-24px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;color:var(--t1);white-space:nowrap}
.ov-glb{display:flex;justify-content:space-between;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t3)}

/* Stats */
.ov-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.ov-st{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:18px 10px;text-align:center;transition:all .2s}
.ov-st:hover{border-color:rgba(255,255,255,.1);background:var(--card2)}
.ov-sv{font-family:'JetBrains Mono',monospace;font-size:1.65rem;font-weight:800;line-height:1.2}
.ov-sl{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}

/* Heatmap */
.ov-ht{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:14px}
.ov-hm{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;grid-auto-rows:min-content;gap:12px;margin-bottom:22px}
.ov-sc{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s}
.ov-sc:hover{border-color:rgba(255,255,255,.12);background:var(--card2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ov-sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.ov-sc-etf{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700}
.ov-sc-nm{font-size:.7rem;color:var(--t2);margin-top:1px}
.ov-sc-sc{font-family:'JetBrains Mono',monospace;font-size:1.75rem;font-weight:800;line-height:1;text-align:right}
.ov-sc-rt{font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:600;text-align:right;margin-top:3px}
/* Vertical bar rows */
.ov-sc-bars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ov-br-row{display:flex;align-items:center;gap:8px;height:14px}
.ov-br-lbl{font-family:'JetBrains Mono',monospace;font-size:.6rem;width:28px;text-align:right;flex-shrink:0}
.ov-br-track{flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden}
.ov-br-fill{height:100%;border-radius:3px;transition:width .5s}
.ov-br-pct{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;width:32px;text-align:right;flex-shrink:0}
/* Footer */
.ov-sc-ft2{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--t3);padding-top:8px;border-top:1px solid rgba(255,255,255,.04)}

/* News column */
.ov-nc{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:18px;grid-row:1/3;overflow-y:auto;min-height:0}
.ov-nc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ov-nc-t{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase}
.ov-ni{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--brd);align-items:start}
.ov-ni:last-child{border-bottom:none}
.ov-ni-s{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800;text-align:center;line-height:1.3}
.ov-ni-tx{font-size:.78rem;color:var(--t1);line-height:1.35}
.ov-ni-tx a{color:var(--t1);text-decoration:none}.ov-ni-tx a:hover{color:var(--acc)}
.ov-ni-tm{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--t3);margin-top:3px}

/* Bottom row */
.ov-bot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.ov-pn{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:20px}
.ov-pt{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:16px}
.ov-bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 4px}
.ov-bc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.ov-bv{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:700;margin-bottom:6px}
.ov-br{width:100%;max-width:52px;border-radius:5px 5px 2px 2px;min-height:8px;transition:height .5s}
.ov-bd{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--t3);margin-top:8px;text-align:center}
.ov-btoday{font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:700;color:var(--acc);letter-spacing:1px;text-transform:uppercase}

/* Daily/Weekly shared */
.sc-card{background:var(--card);border-radius:16px;padding:32px;text-align:center;margin-bottom:24px;border:1px solid var(--brd)}
.bsc{font-family:'JetBrains Mono',monospace;font-size:4rem;font-weight:800;line-height:1}
.sc-lbl{font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:4px;margin-top:8px}
.sc-sub{font-size:.8rem;color:var(--t2);margin-top:12px;font-family:'JetBrains Mono',monospace}
.g-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,#991b1b 0%,#dc2626 20%,#f59e0b 40%,#84cc16 60%,#22c55e 80%,#15803d 100%);position:relative}
.g-mk{position:absolute;top:-6px;transform:translateX(-50%);width:4px;height:24px;background:#fff;border-radius:2px;box-shadow:0 0 12px rgba(255,255,255,.6);transition:left .8s}
.g-lbl{display:flex;justify-content:space-between;margin-top:6px;font-size:.65rem;color:var(--t3);font-family:'JetBrains Mono',monospace}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.sb{background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--brd);transition:all .2s}
.sb:hover{border-color:rgba(255,255,255,.1);background:var(--card2)}
.sb-v{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700}
.sb-l{font-size:.75rem;color:var(--t2);margin-top:4px}
.sn{display:flex;gap:6px;margin-bottom:24px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--brd) transparent}
.nt{padding:8px 16px;border:1px solid var(--brd);border-radius:8px;background:var(--card);color:var(--t2);font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.nt.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px var(--acc-g)}
.nt:hover:not(.on){background:var(--card2);color:var(--t1)}
.sec{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid var(--brd)}
.sec-t{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.7rem;font-weight:600;text-transform:uppercase;color:var(--t3);padding:10px 8px;border-bottom:1px solid var(--brd);font-family:'JetBrains Mono',monospace}
td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem}
tr.ck{cursor:pointer;transition:background .15s}tr.ck:hover{background:rgba(139,92,246,.04)}
.sd{background:var(--card);border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid var(--brd)}
.sd-h{display:flex;justify-content:space-between;align-items:center;padding-left:16px;margin-bottom:20px;border-left:4px solid var(--acc)}
.sd-h h2{font-size:1.3rem;margin-bottom:4px}
.sd-fn{color:var(--t2);font-size:.8rem}
.sd-sb{text-align:right;font-family:'JetBrains Mono',monospace}
.sd-sb .v{font-size:2.4rem;font-weight:800}.sd-sb .b{font-size:.8rem;font-weight:600;text-transform:uppercase}
.sd-sr{display:flex;gap:16px;margin-bottom:20px;padding:14px;background:rgba(255,255,255,.025);border-radius:8px}
.ms{display:flex;flex-direction:column;align-items:center}
.ms .n{font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:700}.ms .t{font-size:.7rem;color:var(--t2)}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.np{background:rgba(0,0,0,.25);border-radius:8px;padding:16px}
.np.ps{border-left:3px solid var(--grn)}.np.ns{border-left:3px solid var(--red)}
.np h3{font-size:.9rem;margin-bottom:12px}
.np table td{font-size:.8rem;padding:6px 6px}
.np a{color:var(--t1);text-decoration:none}.np a:hover{color:var(--acc)}
.ts{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid var(--brd)}
.dp{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:8px;font-size:.8rem;font-family:'JetBrains Mono',monospace;font-weight:600;cursor:pointer;border:1px solid var(--brd);background:var(--card);color:var(--t2);transition:all .2s}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px var(--acc-g)}
.pill .ps2{display:block;font-size:.58rem;font-weight:700;margin-top:1px}
.pill:hover:not(.on){background:var(--card2)}
.ft{text-align:center;padding:24px 20px 16px;font-size:.68rem;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.5px;border-top:1px solid var(--brd);margin-top:8px}
.ft .br{color:var(--acc);font-weight:600}
.ld{display:flex;align-items:center;justify-content:center;min-height:400px;flex-direction:column;gap:16px}
.sp{width:40px;height:40px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:rgba(248,81,73,.1);border:1px solid var(--red);border-radius:12px;padding:24px;text-align:center;margin:40px auto;max-width:600px}
.err h2{color:var(--red);margin-bottom:8px}

@media(max-width:900px){
  .ov-stats{grid-template-columns:repeat(3,1fr)}
  .ov-hm{grid-template-columns:1fr 1fr}
  .ov-nc{grid-row:auto}
  .ov-bot{grid-template-columns:1fr}
  .ov-hero{flex-direction:column}.ov-gw{width:100%}.ov-big{font-size:3.2rem}
  .ng{grid-template-columns:1fr}.bsc{font-size:3rem}
  .sr{grid-template-columns:repeat(2,1fr)}
  .hdr{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="ld" id="loading"><div class="sp"></div><div style="color:var(--t2);">Loading sentiment_data.json...</div></div>
</div>
<script>
const ETFS=['XLK','XLF','XLE','XLV','XLY','XLP','XLI','XLB','XLU','XLRE','XLC'];
const EN={XLB:"Materials",XLC:"Communication Services",XLE:"Energy",XLF:"Financials",XLI:"Industrials",XLK:"Technology",XLP:"Consumer Staples",XLRE:"Real Estate",XLU:"Utilities",XLV:"Healthcare",XLY:"Consumer Discretionary"};
const EF={XLB:"Materials Select Sector SPDR Fund",XLC:"Communication Services Select Sector SPDR Fund",XLE:"Energy Select Sector SPDR Fund",XLF:"Financial Select Sector SPDR Fund",XLI:"Industrial Select Sector SPDR Fund",XLK:"Technology Select Sector SPDR Fund",XLP:"Consumer Staples Select Sector SPDR Fund",XLRE:"Real Estate Select Sector SPDR Fund",XLU:"Utilities Select Sector SPDR Fund",XLV:"Health Care Select Sector SPDR Fund",XLY:"Consumer Discretionary Select Sector SPDR Fund"};
const BD=[{mn:-100,mx:-80,l:"Extreme Fear",e:"🔴🔴🔴",c:"#8B0000"},{mn:-80,mx:-60,l:"Very Bearish",e:"🔴🔴",c:"#CC0000"},{mn:-60,mx:-40,l:"Bearish",e:"🔴",c:"#FF3333"},{mn:-40,mx:-20,l:"Weak Bearish",e:"🟠",c:"#FF8C00"},{mn:-20,mx:0,l:"Slightly Bearish",e:"🟡",c:"#FFD700"},{mn:0,mx:20,l:"Slightly Bullish",e:"🟢",c:"#90EE90"},{mn:20,mx:40,l:"Weak Bullish",e:"🟢🟢",c:"#32CD32"},{mn:40,mx:60,l:"Bullish",e:"🟢🟢🟢",c:"#228B22"},{mn:60,mx:80,l:"Very Bullish",e:"🚀",c:"#006400"},{mn:80,mx:101,l:"Extreme Greed",e:"⚠️🚀",c:"#004D00"}];

function gb(s){s=Math.max(-100,Math.min(100,s));return BD.find(b=>s>=b.mn&&s<b.mx)||BD[5]}
function sc(s){return s>=0?'#10b981':'#ef4444'}
function fs(s){return (s>=0?'+':'')+s.toFixed(1)}

let D=null,cv='overview',sd=null,ss='all';

async function init(){
  try{
    const r=await fetch('sentiment_data.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    D=await r.json();
    const days=Object.keys(D.days).sort();
    sd=days[days.length-1];
    render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="err"><h2>⚠️ Data Load Failed</h2><p style="color:var(--t2)">Could not load sentiment_data.json</p><p style="color:var(--t3);font-size:.8rem;margin-top:12px">${e.message}</p></div>`;
  }
}

function render(){
  if(!D)return;
  const days=Object.keys(D.days).sort();
  const td=D.days[sd];if(!td)return;
  const band=gb(td.overall_score);
  const gp=(td.overall_score+100)/200*100;
  const di=td.score_distribution||{};
  const wk=compWeek(days);
  const dt=new Date(sd+'T00:00:00');
  const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const ds=`${M[dt.getMonth()]} ${String(dt.getDate()).padStart(2,'0')}, ${dt.getFullYear()}`;

  let h=`<div class="hdr"><div class="hdr-l">
    <a href="index.html" class="home-btn" title="Marketwatch Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
    <h1>SECTOR SENTIMENT</h1><span class="badge">ALPHAWARE</span></div>
    <div class="hdr-r"><div class="vtog">
      <button class="vb ${cv==='overview'?'on':''}" onclick="sw('overview')">Overview</button>
      <button class="vb ${cv==='daily'?'on':''}" onclick="sw('daily')">Daily</button>
      <button class="vb ${cv==='weekly'?'on':''}" onclick="sw('weekly')">Weekly</button>
    </div><div class="hdr-date">${ds} <span style="color:var(--acc);font-weight:700">NAVIMOD</span></div></div></div>`;

  if(cv==='overview') h+=rOv(td,band,gp,di,days);
  else if(cv==='daily') h+=rDay(td,band,gp,di,days);
  else h+=rWeek(wk,days);

  h+=`<div class="ft"><span class="br">NAVIMOD</span> Financial Analytics · ${sd} · ${td.total_articles} articles analyzed</div>`;
  document.getElementById('app').innerHTML=h;
}

// ══════ OVERVIEW ══════
function rOv(td,band,gp,di,days){
  const sec=td.sectors||{};
  const sorted=Object.entries(sec).sort((a,b)=>b[1].avg_score-a[1].avg_score);
  const seen=new Set();let news=[];
  for(const[e,i]of Object.entries(sec)){
    for(const arr of[i.top_positive||[],i.top_negative||[]]){
      for(const a of arr){if(a.score!==0&&!seen.has(a.title)){seen.add(a.title);news.push({...a,etf:e})}}
    }
  }
  news.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));
  const posNews=news.filter(n=>n.score>0).sort((a,b)=>b.score-a.score);
  const negNews=news.filter(n=>n.score<0).sort((a,b)=>a.score-b.score);
  const best=sorted[0]?sorted[0][1].avg_score:0;
  const weak=sorted.length?sorted[sorted.length-1][1].avg_score:0;
  const conf=td.avg_confidence||di.avg_confidence||0;

  let h='';
  // Hero
  h+=`<div class="ov-hero anim" style="border-bottom:3px solid ${band.c}">
    <div class="ov-hero-l">
      <div class="ov-lbl">OVERALL MARKET SENTIMENT · ${td.total_articles} ARTICLES ANALYZED</div>
      <div class="ov-row"><span class="ov-big" style="color:${band.c}">${fs(td.overall_score)}</span><span class="ov-band" style="color:${band.c}">${band.l.toUpperCase()}</span></div>
      <div class="ov-sub"><span class="g">${(di.positive_pct||0).toFixed(0)}% positive</span> <span class="r" style="margin-left:12px">${(di.negative_pct||0).toFixed(0)}% negative</span> <span style="margin-left:12px">${conf.toFixed(2)} conf ${conf.toFixed(1)}/3</span></div>
    </div>
    <div class="ov-gw"><div class="ov-gb"><div class="ov-gn" style="left:${gp}%"><div class="ov-gsl">×${td.overall_score.toFixed(1)}</div></div></div><div class="ov-glb"><span>-10%</span><span>+10%</span><span>BULLISH</span></div></div>
  </div>`;

  // Stats
  h+=`<div class="ov-stats anim d1">
    <div class="ov-st"><div class="ov-sv">${td.total_articles}</div><div class="ov-sl">ARTICLES ANALYZED</div></div>
    <div class="ov-st"><div class="ov-sv" style="color:var(--grn)">${(di.positive_pct||0).toFixed(0)}%</div><div class="ov-sl">POSITIVE</div></div>
    <div class="ov-st"><div class="ov-sv" style="color:var(--red)">${(di.negative_pct||0).toFixed(0)}%</div><div class="ov-sl">NEGATIVE</div></div>
    <div class="ov-st"><div class="ov-sv" style="color:${sc(td.overall_score)}">${fs(td.overall_score)}</div><div class="ov-sl">OVERALL</div></div>
    <div class="ov-st"><div class="ov-sv" style="color:${sc(best)}">${best.toFixed(1)}</div><div class="ov-sl">BEST</div></div>
    <div class="ov-st"><div class="ov-sv">${sorted.length}</div><div class="ov-sl">WEAKEST</div></div>
  </div>`;

  // Heatmap
  h+=`<div class="ov-ht anim d2">SECTOR SENTIMENT HEATMAP</div><div class="ov-hm anim d2">`;

  // TOP-LEFT: Positive news panel (grid column 1, spans 2 rows)
  h+=`<div class="ov-nc" style="border-left:3px solid var(--grn)"><div class="ov-nc-hd"><span class="ov-nc-t" style="color:var(--grn)">🟢 TOP POSITIVE</span></div>`;
  for(const n of posNews.slice(0,5)){
    h+=`<div class="ov-ni"><div class="ov-ni-s" style="color:var(--grn)">+${n.score}</div><div><div class="ov-ni-tx"><a href="${n.link||'#'}" target="_blank">${(n.title||'').slice(0,75)}</a></div><div class="ov-ni-tm">2hr ago</div></div></div>`;
  }
  if(!posNews.length) h+=`<div style="color:var(--t3);font-size:.8rem;padding:12px 0">No positive signals</div>`;
  h+=`</div>`;

  const top6=sorted.slice(0,6);
  for(let i=0;i<top6.length;i++){
    const[etf,info]=top6[i];const s=info.avg_score;const cl=sc(s);
    const mr=info.market_return;const ms=(mr!=null&&mr!==0)?`${mr>=0?'+':''}${mr.toFixed(1)}%`:'';
    const mc=(mr!=null&&mr>=0)?'var(--grn)':'var(--red)';
    const bp=Math.min(100,Math.max(8,(Math.abs(s)/25)*100));
    const cf=info.avg_confidence?info.avg_confidence.toFixed(1):'—';
    const pp=Math.round(info.positive_pct||0);
    const np2=Math.round(info.negative_pct||0);
    const neup=Math.max(0,100-pp-np2);
    const cnt=info.count||0;
    const bandLabel=gb(s).l;
    h+=`<div class="ov-sc" onclick="sw('daily');setTimeout(()=>selS('${etf}'),60)">
      <div class="ov-sc-top"><div><div class="ov-sc-etf">${etf}</div><div class="ov-sc-nm">${EN[etf]}</div></div>
        <div><div class="ov-sc-sc" style="color:${cl}">${fs(s)}</div>${ms?`<div class="ov-sc-rt" style="color:${mc}">${ms}</div>`:''}</div></div>
      <div class="ov-sc-bars">
        <div class="ov-br-row"><span class="ov-br-lbl" style="color:var(--grn)">POS</span><div class="ov-br-track"><div class="ov-br-fill" style="width:${pp}%;background:var(--grn)"></div></div><span class="ov-br-pct" style="color:var(--grn)">${pp}%</span></div>
        <div class="ov-br-row"><span class="ov-br-lbl" style="color:rgba(210,153,34,.8)">NEU</span><div class="ov-br-track"><div class="ov-br-fill" style="width:${neup}%;background:rgba(210,153,34,.45)"></div></div><span class="ov-br-pct" style="color:var(--t2)">${neup}%</span></div>
        <div class="ov-br-row"><span class="ov-br-lbl" style="color:var(--red)">NEG</span><div class="ov-br-track"><div class="ov-br-fill" style="width:${np2}%;background:var(--red)"></div></div><span class="ov-br-pct" style="color:var(--red)">${np2}%</span></div>
      </div>
      <div class="ov-sc-ft2"><span>${bandLabel}</span><span>${cnt} articles</span><span>conf ${cf}</span></div>
    </div>`;
  }
  h+=`</div>`;

  // Bottom
  const td2=days.slice(-5);const ts2=td2.map(d=>D.days[d]?.overall_score||0);
  const ma=Math.max(1,...ts2.map(Math.abs));
  h+=`<div class="ov-bot anim d3"><div class="ov-pn"><div class="ov-pt">${td2.length}-DAY SENTIMENT TRENDS</div><div class="ov-bars">`;
  for(let i=0;i<td2.length;i++){
    const s=ts2[i];const cl=sc(s);const hp=Math.max(10,(Math.abs(s)/ma)*85);
    const it=td2[i]===sd;const bc=it?'var(--acc)':cl;const dl=td2[i].slice(5).replace('-','.');
    h+=`<div class="ov-bc"><div class="ov-bv" style="color:${cl}">${fs(s)}</div><div class="ov-br" style="height:${hp}%;background:${bc}"></div>${it?`<div class="ov-bd"><span class="ov-btoday">TODAY</span></div>`:`<div class="ov-bd">${dl}</div>`}</div>`;
  }
  // BOTTOM-RIGHT: Negative news panel
  h+=`</div></div><div class="ov-pn" style="border-left:3px solid var(--red)"><div class="ov-pt" style="color:var(--red)">🔴 TOP NEGATIVE</div>`;
  for(const n of negNews.slice(0,5)){
    h+=`<div class="ov-ni"><div class="ov-ni-s" style="color:var(--red)">${n.score}</div><div><div class="ov-ni-tx"><a href="${n.link||'#'}" target="_blank">${(n.title||'').slice(0,80)}</a></div><div class="ov-ni-tm">2hr ago</div></div></div>`;
  }
  if(!negNews.length) h+=`<div style="color:var(--t3);font-size:.8rem;padding:12px 0">No negative signals</div>`;
  h+=`</div></div>`;
  return h;
}

// ══════ DAILY ══════
function rDay(td,band,gp,di,days){
  const sec=td.sectors||{};const sorted=Object.entries(sec).sort((a,b)=>b[1].avg_score-a[1].avg_score);
  let h=`<div class="dp">`;
  for(const d of days){const s=D.days[d]?.overall_score||0;const pc=d===sd?'rgba(255,255,255,.8)':(s>=0?'var(--grn)':'var(--red)');
    h+=`<div class="pill ${d===sd?'on':''}" onclick="selD('${d}')">${d.slice(5)}<span class="ps2" style="color:${pc}">${(s>=0?'+':'')+Math.round(s)}</span></div>`;}
  h+=`</div>`;
  h+=`<div class="sc-card" style="border-bottom:4px solid ${band.c}"><div class="bsc" style="color:${band.c}">${fs(td.overall_score)}</div><div class="sc-lbl" style="color:${band.c}">${band.e} ${band.l}</div><div style="margin:24px auto;max-width:500px"><div class="g-bar"><div class="g-mk" style="left:${gp}%"></div></div><div class="g-lbl"><span>-100 Fear</span><span>0</span><span>+100 Greed</span></div></div><div class="sc-sub">${td.total_articles} articles • ${sd}</div></div>`;
  const sp=td.spy_return;const sph=sp!=null?`<div class="sb"><div class="sb-v" style="color:${sp>=0?'var(--grn)':'var(--red)'}">${sp>=0?'+':''}${sp.toFixed(2)}%</div><div class="sb-l">SPY Return</div></div>`:'';
  h+=`<div class="sr"><div class="sb"><div class="sb-v">${td.total_articles}</div><div class="sb-l">Total Articles</div></div><div class="sb"><div class="sb-v" style="color:var(--grn)">${di.positive_pct?.toFixed(0)||0}%</div><div class="sb-l">Positive</div></div><div class="sb"><div class="sb-v" style="color:var(--red)">${di.negative_pct?.toFixed(0)||0}%</div><div class="sb-l">Negative</div></div><div class="sb"><div class="sb-v">${di.mean?fs(di.mean):'0'}</div><div class="sb-l">Mean</div></div><div class="sb"><div class="sb-v">${di.median?fs(di.median):'0'}</div><div class="sb-l">Median</div></div><div class="sb"><div class="sb-v">${di.std?.toFixed(1)||'0'}</div><div class="sb-l">Std Dev</div></div>${sph}</div>`;
  h+=`<div class="sn"><div class="nt ${ss==='all'?'on':''}" onclick="selS('all')">All Sectors</div>`;
  for(const e of ETFS){const s=sec[e]?.avg_score||0;const c=ss===e?'rgba(255,255,255,.7)':(s>=0?'var(--grn)':'var(--red)');
    h+=`<div class="nt ${ss===e?'on':''}" onclick="selS('${e}')">${e} <span style="font-size:.62rem;font-weight:700;color:${c}">${(s>=0?'+':'')+Math.round(s)}</span></div>`;}
  h+=`</div>`;
  if(ss==='all'){
    const sr2=td.spy_return;const sstr=sr2!=null?`SPY: ${sr2>=0?'+':''}${sr2.toFixed(2)}%`:'';
    h+=`<div class="sec"><div class="sec-t">🏭 Sector ETF Sentiment ${sstr?`<span style="margin-left:16px;font-size:.8em;color:${sr2>=0?'var(--grn)':'var(--red)'}">${sstr}</span>`:''}</div><table><thead><tr><th>ETF</th><th>Sector</th><th>Score</th><th>Return</th><th>Band</th><th>Articles</th><th>Positive</th><th>Negative</th></tr></thead><tbody>`;
    for(const[e,i]of sorted){const b=gb(i.avg_score);const mr=i.market_return;const ms=mr!=null?`${mr>=0?'+':''}${mr.toFixed(2)}%`:'—';const mc=mr==null?'var(--t3)':mr>=0?'var(--grn)':'var(--red)';
      h+=`<tr class="ck" onclick="selS('${e}')"><td><strong>${e}</strong></td><td>${b.e} ${EN[e]||e}</td><td style="color:${sc(i.avg_score)};font-weight:bold">${fs(i.avg_score)}</td><td style="color:${mc};font-weight:bold;font-family:'JetBrains Mono',monospace;font-size:.85em">${ms}</td><td>${i.band||b.l}</td><td>${i.count||0}</td><td style="color:var(--grn)">${(i.positive_pct||0).toFixed(0)}%</td><td style="color:var(--red)">${(i.negative_pct||0).toFixed(0)}%</td></tr>`;}
    h+=`</tbody></table></div>`;
  }
  for(const[e,i]of sorted){if(ss!=='all'&&ss!==e)continue;h+=rSD(e,i);}
  return h;
}

function rSD(etf,info){
  const b=gb(info.avg_score);const cl=sc(info.avg_score);
  const pc=Math.round((info.positive_pct||0)*(info.count||0)/100);
  const nc=Math.round((info.negative_pct||0)*(info.count||0)/100);
  const nu=(info.count||0)-pc-nc;
  let pr='',nr='';
  (info.top_positive||[]).filter(a=>a.score>0).slice(0,10).forEach((a,i)=>{pr+=`<tr><td>${i+1}</td><td style="color:var(--grn);font-weight:bold">+${a.score}</td><td><a href="${a.link||'#'}" target="_blank">${(a.title||'').slice(0,75)}</a></td></tr>`;});
  (info.top_negative||[]).filter(a=>a.score<0).slice(0,10).forEach((a,i)=>{nr+=`<tr><td>${i+1}</td><td style="color:var(--red);font-weight:bold">${a.score}</td><td><a href="${a.link||'#'}" target="_blank">${(a.title||'').slice(0,75)}</a></td></tr>`;});
  return `<div class="sd"><div class="sd-h" style="border-left-color:${cl}"><div><h2>${b.e} ${etf} — ${EN[etf]||etf}</h2><div class="sd-fn">${EF[etf]||''}</div></div><div class="sd-sb"><div class="v" style="color:${cl}">${fs(info.avg_score)}</div><div class="b" style="color:${cl}">${info.band||b.l}</div></div></div>
  <div class="sd-sr"><div class="ms"><span class="n">${info.count||0}</span><span class="t">Articles</span></div><div class="ms"><span class="n" style="color:var(--grn)">${pc}</span><span class="t">Positive</span></div><div class="ms"><span class="n" style="color:var(--red)">${nc}</span><span class="t">Negative</span></div><div class="ms"><span class="n">${nu}</span><span class="t">Neutral</span></div></div>
  <div class="ng"><div class="np ps"><h3>🟢 Top Positive News</h3><table>${pr||'<tr><td colspan="3" style="color:var(--t3)">No data</td></tr>'}</table></div><div class="np ns"><h3>🔴 Top Negative News</h3><table>${nr||'<tr><td colspan="3" style="color:var(--t3)">No data</td></tr>'}</table></div></div></div>`;
}

// ══════ WEEKLY ══════
function compWeek(days){
  const r={days:[],overall:[],spy_returns:[],sectors:{}};
  for(const e of ETFS) r.sectors[e]={scores:[],returns:[]};
  for(const d of days){const dd=D.days[d];if(!dd)continue;r.days.push(d);r.overall.push(dd.overall_score||0);r.spy_returns.push(dd.spy_return??null);
    for(const e of ETFS){r.sectors[e].scores.push(dd.sectors?.[e]?.avg_score||null);r.sectors[e].returns.push(dd.sectors?.[e]?.market_return??null);}}
  return r;
}

function rWeek(wk,days){
  if(days.length<2)return`<div class="sec" style="text-align:center;padding:60px"><h2 style="color:var(--t2)">📅 Weekly view needs 2+ days</h2></div>`;
  const lt=D.days[days[days.length-1]],pv=D.days[days[days.length-2]];
  const oc=(lt?.overall_score||0)-(pv?.overall_score||0);
  const wa=wk.overall.reduce((a,b)=>a+b,0)/wk.overall.length;
  const wb=gb(wa);const ta=days.reduce((a,d)=>a+(D.days[d]?.total_articles||0),0);
  const sr=wk.spy_returns.filter(r=>r!=null&&r!==0);const scr=sr.reduce((a,b)=>a+b,0);

  let h=`<div class="sc-card" style="border-bottom:4px solid ${wb.c}"><div style="font-size:.8rem;color:var(--t2);margin-bottom:8px">WEEKLY AVERAGE (${days.length} days)</div><div class="bsc" style="color:${wb.c}">${fs(wa)}</div><div class="sc-lbl" style="color:${wb.c}">${wb.e} ${wb.l}</div><div class="sc-sub">Last day change: <span style="color:${oc>=0?'var(--grn)':'var(--red)'};font-weight:700">${fs(oc)}</span>${sr.length?` · SPY week: <span style="color:${scr>=0?'var(--grn)':'var(--red)'};font-weight:700">${scr>=0?'+':''}${scr.toFixed(2)}%</span>`:''} · ${ta} total articles · ${days[0]} → ${days[days.length-1]}</div></div>`;

  h+=`<div class="ts"><div class="sec-t">📈 Overall Sentiment Trend</div><canvas id="tc" width="800" height="240"></canvas></div>`;

  h+=`<div class="sec"><div class="sec-t">🏭 Sector Weekly Summary</div><table><thead><tr><th>ETF</th><th>Sector</th><th>Last Day</th><th>Week Avg</th><th>Return</th><th>Change</th><th>Trend</th></tr></thead><tbody>`;
  const sw2=[];
  for(const e of ETFS){const ss2=wk.sectors[e].scores.filter(s=>s!==null);const rs=wk.sectors[e].returns.filter(r=>r!=null&&r!==0);const av=ss2.length?ss2.reduce((a,b)=>a+b,0)/ss2.length:0;const la=ss2[ss2.length-1]||0;const pr=ss2.length>=2?ss2[ss2.length-2]:la;const ch=la-pr;const cr=rs.reduce((a,b)=>a+b,0);sw2.push({e,av,la,ch,ss:ss2,cr,hr:rs.length>0});}
  sw2.sort((a,b)=>b.av-a.av);
  for(const s of sw2){const b=gb(s.av);const cc=s.ch>=0?'var(--grn)':'var(--red)';const ar=s.ch>=0?'▲':'▼';const sp=s.ss.map(v=>v?.toFixed(0)||'-').join(' → ');const rs=s.hr?`${s.cr>=0?'+':''}${s.cr.toFixed(2)}%`:'—';const rc=!s.hr?'var(--t2)':s.cr>=0?'var(--grn)':'var(--red)';
    h+=`<tr><td><strong>${s.e}</strong></td><td>${b.e} ${EN[s.e]}</td><td style="color:${sc(s.la)};font-weight:bold">${fs(s.la)}</td><td style="font-weight:600">${fs(s.av)}</td><td style="color:${rc};font-weight:bold;font-family:'JetBrains Mono',monospace;font-size:.85em">${rs}</td><td style="color:${cc};font-weight:bold">${ar} ${Math.abs(s.ch).toFixed(1)}</td><td style="font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--t2)">${sp}</td></tr>`;}
  h+=`</tbody></table></div>`;
  setTimeout(()=>drawTC(wk),50);
  return h;
}

function drawTC(wk){
  const cv2=document.getElementById('tc');if(!cv2)return;const cx=cv2.getContext('2d');
  const rc=cv2.parentElement.getBoundingClientRect();cv2.width=rc.width*2;cv2.height=480;cv2.style.width=rc.width+'px';cv2.style.height='240px';cx.scale(2,2);
  const W=rc.width,H=240,p={t:20,r:20,b:40,l:50},pW=W-p.l-p.r,pH=H-p.t-p.b;
  const v=wk.overall,mn=Math.min(-20,...v),mx=Math.max(20,...v),rn=mx-mn||1;
  const xP=i=>p.l+(i/(v.length-1||1))*pW,yP=val=>p.t+pH-((val-mn)/rn)*pH;
  cx.fillStyle='transparent';cx.fillRect(0,0,W,H);
  if(mn<0&&mx>0){const y0=yP(0);cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=1;cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(p.l,y0);cx.lineTo(W-p.r,y0);cx.stroke();cx.setLineDash([]);cx.fillStyle='#4b5563';cx.font='10px JetBrains Mono';cx.textAlign='right';cx.fillText('0',p.l-8,y0+3);}
  const g=cx.createLinearGradient(0,p.t,0,p.t+pH);g.addColorStop(0,'rgba(16,185,129,.15)');g.addColorStop(.5,'rgba(99,102,241,.05)');g.addColorStop(1,'rgba(239,68,68,.15)');
  cx.beginPath();cx.moveTo(xP(0),yP(v[0]));for(let i=1;i<v.length;i++)cx.lineTo(xP(i),yP(v[i]));cx.lineTo(xP(v.length-1),p.t+pH);cx.lineTo(xP(0),p.t+pH);cx.closePath();cx.fillStyle=g;cx.fill();
  cx.beginPath();cx.moveTo(xP(0),yP(v[0]));for(let i=1;i<v.length;i++){const x0=xP(i-1),y0=yP(v[i-1]),x1=xP(i),y1=yP(v[i]),cp=(x0+x1)/2;cx.bezierCurveTo(cp,y0,cp,y1,x1,y1);}cx.strokeStyle='#8b5cf6';cx.lineWidth=2.5;cx.lineJoin='round';cx.stroke();
  for(let i=0;i<v.length;i++){const x=xP(i),y=yP(v[i]);cx.beginPath();cx.arc(x,y,8,0,Math.PI*2);cx.fillStyle=v[i]>=0?'rgba(63,185,80,.15)':'rgba(248,81,73,.15)';cx.fill();cx.beginPath();cx.arc(x,y,4,0,Math.PI*2);cx.fillStyle=v[i]>=0?'#3fb950':'#f85149';cx.fill();cx.strokeStyle='#06080d';cx.lineWidth=2;cx.stroke();cx.fillStyle='#e5e7eb';cx.font='bold 10px JetBrains Mono';cx.textAlign='center';cx.fillText(fs(v[i]),x,y-12);cx.fillStyle='#6b7280';cx.font='9px JetBrains Mono';cx.fillText(wk.days[i]?.slice(5)||'',x,H-p.b+16);}
  cx.fillStyle='#4b5563';cx.font='9px JetBrains Mono';cx.textAlign='right';for(let i=0;i<=5;i++){const val=mn+(rn/5)*i;cx.fillText(val.toFixed(0),p.l-8,yP(val)+3);}
}

function sw(v){cv=v;if(v!=='daily')ss='all';render();}
function selD(d){sd=d;ss='all';render();}
function selS(e){ss=e;render();if(e!=='all')setTimeout(()=>{const el=document.querySelector('.sd');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);}

init();
</script>
